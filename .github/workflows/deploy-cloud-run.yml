name: Deploy to Google Cloud Run

on:
  push:
    branches: [ main, master ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }} # Enter your Google Cloud Project ID in GitHub Secrets
  SERVICE_NAME: vectra-icon-platform       # Name of your Cloud Run service
  REGION: us-central1                       # Target Google Cloud Region

jobs:
  deploy-to-cloud-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for authenticating with Google Cloud Workload Identity

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Quality Verification
        run: npm run lint

      # 1. Authenticate with Google Cloud
      # To set this up, create a GCP Service Account with 'Cloud Run Developer' and 'Storage Admin' roles,
      # and add the service account key JSON as a Github Secret named GCP_SA_KEY.
      - name: Authenticate with Google Cloud
        if: "${{ env.PROJECT_ID != '' }}"
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 2. Set up Cloud SDK
      - name: Set up Cloud SDK
        if: "${{ env.PROJECT_ID != '' }}"
        uses: google-github-actions/setup-gcloud@v2

      # 3. Build & Deploy using Cloud Builds
      # Builds the Docker container and deploys it directly to Google Cloud Run.
      - name: Deploy to Cloud Run
        if: "${{ env.PROJECT_ID != '' }}"
        run: |
          gcloud builds submit --tag gcr.io/$PROJECT_ID/$SERVICE_NAME:$GITHUB_SHA
          gcloud run deploy $SERVICE_NAME \
            --image gcr.io/$PROJECT_ID/$SERVICE_NAME:$GITHUB_SHA \
            --platform managed \
            --region $REGION \
            --allow-unauthenticated
